# ===== CẤU HÌNH ĐÁ GÀ =====
bet:
  min: 100
  max: 1000000
  presets: [0, 100, 500, 1000, 5000, 10000]   # các mức cược hiện trong menu
tax-percent: 5                  # % thuế sàn trừ trên tổng tiền cược
challenge-timeout-seconds: 30

fight:
  max-rounds: 30
  chat-log: false               # true = in từng đòn đánh vào khung chat (mặc định tắt, chỉ hiện chữ nổi trên đầu gà)
  antifarm-minutes: 10          # đấu cùng 1 đối thủ liên tiếp trong khoảng này: không nhận XP/trứng/xếp hạng
  broadcast-min-bet: 5000       # cược từ mức này trở lên sẽ thông báo toàn server (0 = tắt)
  round-delay-ticks: 50         # 20 tick = 1 giây
injury:
  chance: 0.35                  # tỉ lệ gà thua bị thương
  minutes: 10
win-egg-chance: 0.08            # tỉ lệ người thắng nhận trứng cổ đại

training-cooldown-seconds: 30
rest-cooldown-seconds: 120
breed-cooldown-minutes: 30
mutation-chance: 0.06           # đột biến khi ghép gen
full-moon-mutation-multiplier: 3

incubator-slots: 2
hatch-time-multiplier: 1.0
campfire-hatch-speedup: 0.3     # đứng gần lửa trại (bán kính 5) ấp nhanh hơn 30%

drops:
  mob-egg-chance: 0.015         # quái chết rơi trứng bí ẩn
  fishing-egg-chance: 0.03      # câu cá ra trứng bí ẩn
  mob-egg-cooldown-seconds: 60  # mỗi người chỉ nhận trứng từ quái tối đa 1 lần / khoảng này
  fishing-egg-cooldown-seconds: 60

wild-chicken:
  variant-chance: 0.2           # tỉ lệ gà sinh ra ở biome đặc biệt là gà hoang
  tame-chance: 0.45

rarity-weights:
  thuong: 55
  kha: 28
  hiem: 14
  huyen-thoai: 3

death:
  respawn-minutes: 15           # gà chết phải chờ bao lâu mới hồi sinh
  weak-minutes: 10              # sau hồi sinh còn yếu (chỉ số giảm 20%) bao lâu
# arena: đặt bằng lệnh /daga setarena (không đặt thì gà đấu ngay trước mặt người chấp nhận)

coop:
  slots: 18                     # số chỗ trong chuồng gà (tối đa 45)

spar:
  cooldown-seconds: 120         # đấu thử gà máy (admin không bị cooldown)

shop:
  prices:
    mystery-egg: 1500
    ancient-egg: 8000
    seeds: 50
    wheat: 80
    bread: 100
    golden-carrot: 400
    golden-apple: 1000

companion:
  follow-distance: 5            # gà cách chủ xa hơn thì chạy lại gần
  teleport-distance: 16         # xa hơn nữa thì dịch chuyển tới chủ
  dig-minutes: 3                # gà bới đất ra hạt giống mỗi bao nhiêu phút (từ cấp 2)

wildfight:
  cooldown-seconds: 20          # đấu gà làng (Shift + chuột phải vào gà), admin không bị cooldown

xp-multiplier: 1.0              # nhân kinh nghiệm của gà (2.0 = lên cấp nhanh gấp đôi)

pet:
  cooldown-seconds: 45          # hồi chiêu vuốt ve gà (chuột phải tay không)

neglect:
  enabled: true                 # bỏ đói gà quá lâu thì gà chết hẳn và để lại mộ
  starve-hours: 168             # gà hết no (no = 0) mà không được cho ăn suốt chừng này giờ THẬT (168 = 1 tuần, tính cả lúc chủ offline) thì chết. Lúc offline gà không đói thêm
  revive-item: TOTEM_OF_UNDYING # vật phẩm hồi sinh gà từ mộ (mất 2 cấp). Đặt NONE để tắt hồi sinh
